<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>VerseCraft Main</title>
  <style>
    body { background:#000; color:#fff; text-align:center; font-family:system-ui; margin-top:3rem; }
    a { color:#0f0; text-decoration:none; font-size:1.5rem; }
  </style>

<body>
  <h1>VerseCraft Platform</h1>
  <p><a href="./engine-state-test.html">Launch Engine Test</a></p>
 <script>
(function () {
  const banner = document.createElement("div");
  banner.style.cssText = `
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99999;
    background: rgba(0,0,0,0.85);
    color: #0ff;
    font-family: monospace;
    font-size: 12px;
    padding: 6px 10px;
    pointer-events: none;
  `;
  banner.textContent =
    "SCREEN: " + location.pathname.split("/").pop() +
    " | CACHE: " + (performance.getEntriesByType("navigation")[0]?.transferSize === 0 ? "CACHED" : "FRESH");
  document.body.appendChild(banner);
})();
</script> 
</body>
</html>
