<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dragons of Fire — Panel Harness</title>

  <link rel="stylesheet" href="./ui/themes/dragonsoffire_panel.css" />
</head>
<body>
  <div id="debugBanner"></div>

  <div class="panel-root" id="panelRoot">
    <div class="panel-overlay">
      <!-- Narrative window (contains reserved media region + scrollable text) -->
      <div id="panelNarrativeWindow">
        <div id="panelMedia" aria-hidden="true"></div>
        <div id="panelNarrative"></div>
      </div>

      <!-- Choice pill hit targets -->
      <button id="choice0" class="choice-pill" type="button"></button>
      <button id="choice1" class="choice-pill" type="button"></button>
      <button id="choice2" class="choice-pill" type="button"></button>
      <button id="choice3" class="choice-pill" type="button"></button>
    </div>
  </div>

  <script type="module">
    import { PanelEngine } from './core/panel_engine.js';

    const qs = new URLSearchParams(location.search);
    const storyId = qs.get('story') || 'world_of_lorecraft';
    const debug = qs.has('debug');

    document.documentElement.classList.toggle('debug', debug);

    // Debug banner: confirms active page + story + cache-ish navigation type.
    const nav = performance.getEntriesByType('navigation')[0];
    const cacheTag = (nav && nav.transferSize === 0) ? 'CACHED' : 'FRESH';
    const banner = document.getElementById('debugBanner');
    banner.textContent = `SCREEN: ${location.pathname.split('/').pop()} | story=${storyId} | ${cacheTag} | ?debug=1`;

    const engine = new PanelEngine({
      storyId,
      elNarrative: document.getElementById('panelNarrative'),
      choiceButtons: [
        document.getElementById('choice0'),
        document.getElementById('choice1'),
        document.getElementById('choice2'),
        document.getElementById('choice3'),
      ],
      elDebug: banner
    });

    engine.init().catch((err) => {
      console.error(err);
      banner.textContent = `❌ ${err.message || err}`;
    });
  </script>
</body>
</html>
